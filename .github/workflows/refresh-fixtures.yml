name: Refresh fixtures

on:
  schedule:
    # Poll near expected full time. The first Python step gates API usage, so
    # off-window runs exit without touching the secret or external service.
    - cron: "7,37 * * * *"
    # Weekly fallback for provider delays or an unusual match state.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fixture-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check whether a match is near full time
        id: refresh-window
        env:
          FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '17 9 * * 1' }}
        run: |
          if test "$FORCE_REFRESH" = "true"; then
            python3 pipeline/fixture_refresh_due.py --force --github-output "$GITHUB_OUTPUT"
          else
            python3 pipeline/fixture_refresh_due.py --github-output "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.refresh-window.outputs.due == 'true'
        with:
          python-version: "3.13"
      - name: Require the football-data.org secret
        if: steps.refresh-window.outputs.due == 'true'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: test -n "$FOOTBALL_DATA_API_KEY"
      - name: Pull current fixture and result records
        if: steps.refresh-window.outputs.due == 'true'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python3 pipeline/pull_fixtures.py
      - name: Create result-only observations and rebuild posteriors
        if: steps.refresh-window.outputs.due == 'true'
        run: |
          python3 pipeline/sync_result_observations.py
          python3 pipeline/build_posteriors.py --write
      - name: Validate refreshed data and analysis
        if: steps.refresh-window.outputs.due == 'true'
        run: |
          python3 -m unittest discover -s tests -v
          python3 pipeline/validate_data.py
          python3 pipeline/build_posteriors.py --check
      - name: Commit fixture and posterior changes when needed
        if: steps.refresh-window.outputs.due == 'true'
        id: data-commit
        run: |
          if test -z "$(git status --porcelain -- data/fixtures data/observations data/posteriors)"; then
            echo "No finished-match changes returned by football-data.org."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures data/observations data/posteriors
          git commit -m "Refresh fixtures and automated posterior"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed match analysis
        if: steps.data-commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
