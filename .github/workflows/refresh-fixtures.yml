name: Refresh fixtures

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fixture-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Require the football-data.org secret
        run: test -n "$FOOTBALL_DATA_API_KEY"
      - name: Pull current fixture and result records
        run: python3 pipeline/pull_fixtures.py
      - name: Validate refreshed data
        run: |
          python3 -m unittest discover -s tests -v
          python3 pipeline/validate_data.py
          python3 pipeline/build_posteriors.py --check
      - name: Commit fixture changes when needed
        id: fixture-commit
        run: |
          if test -z "$(git status --porcelain -- data/fixtures)"; then
            echo "No fixture changes returned by football-data.org."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures
          git commit -m "Refresh Liverpool fixtures"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy refreshed fixture data
        if: steps.fixture-commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
